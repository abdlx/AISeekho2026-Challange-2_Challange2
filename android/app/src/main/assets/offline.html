<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AISO – Connect to Internet</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #ca8a04;
      --accent-glow: rgba(202, 138, 4, 0.25);
      --bg: #0c0a09;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: rgba(255,255,255,0.88);
      --muted: rgba(255,255,255,0.35);
    }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      overflow: hidden;
    }

    .aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .aurora-1 {
      position: absolute;
      top: -25%; left: -25%;
      width: 85%; aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(202,138,4,0.10) 0%, transparent 70%);
      animation: drift1 12s ease-in-out infinite;
    }
    .aurora-2 {
      position: absolute;
      bottom: -25%; right: -25%;
      width: 80%; aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,0.09) 0%, transparent 70%);
      animation: drift2 15s ease-in-out infinite;
    }
    .aurora-3 {
      position: absolute;
      top: 35%; left: 35%;
      width: 65%; aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(14,165,233,0.07) 0%, transparent 70%);
      animation: drift3 18s ease-in-out infinite;
    }

    @keyframes drift1 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(4%,6%) scale(1.06); }
    }
    @keyframes drift2 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(-5%,-4%) scale(1.08); }
    }
    @keyframes drift3 {
      0%,100% { transform: translate(0,0) scale(1); }
      50%      { transform: translate(3%,-5%) scale(1.04); }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(12,10,9,0.5);
      backdrop-filter: blur(2px);
      z-index: 1;
    }

    .card {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 24px) 32px env(safe-area-inset-bottom, 32px);
      text-align: center;
    }

    .glass {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 44px 32px 40px;
      backdrop-filter: blur(32px) saturate(180%);
      box-shadow: 0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.07);
      animation: slideUp 0.65s cubic-bezier(0.23,1,0.32,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-wrap {
      position: relative;
      width: 80px; height: 80px;
      background: rgba(202,138,4,0.08);
      border: 1px solid rgba(202,138,4,0.2);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }
    .icon-glow {
      position: absolute;
      inset: -4px;
      background: var(--accent-glow);
      border-radius: 32px;
      filter: blur(18px);
      animation: pulse-glow 2.5s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%,100% { opacity: 0.5; transform: scale(1); }
      50%      { opacity: 1; transform: scale(1.1); }
    }

    .zap-icon {
      position: relative;
      z-index: 1;
    }
    .zap-icon svg {
      width: 38px; height: 38px;
      fill: var(--accent);
      animation: pulse-icon 2.5s ease-in-out infinite;
    }
    @keyframes pulse-icon {
      0%,100% { opacity: 0.9; }
      50%      { opacity: 1; }
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.82rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .subtitle em {
      font-style: italic;
      font-family: 'Playfair Display', serif;
      color: rgba(202,138,4,0.65);
    }

    /* offline pill badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 999px;
      padding: 10px 20px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
    }
    .badge-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px 2px rgba(239,68,68,0.5);
      animation: blink 1.4s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.25; }
    }
    .badge-text {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #fca5a5;
    }

    .message {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 32px;
    }
    .message strong {
      color: rgba(255,255,255,0.6);
      font-weight: 500;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border), transparent);
      margin: 0 auto 20px;
    }

    .footer {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 4px;
    }
    .footer span {
      font-size: 0.58rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .footer .tag1 { color: rgba(255,255,255,0.15); }
    .footer .tag2 { color: rgba(202,138,4,0.3); }
  </style>
</head>
<body>
  <div class="aurora">
    <div class="aurora-1"></div>
    <div class="aurora-2"></div>
    <div class="aurora-3"></div>
  </div>
  <div class="overlay"></div>

  <div class="card">
    <div class="glass">
      <div class="icon-wrap">
        <div class="icon-glow"></div>
        <div class="zap-icon">
          <!-- Zap SVG (Lucide) -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
          </svg>
        </div>
      </div>

      <h1>AISO</h1>
      <p class="subtitle">Secure agentic service<br><em>orchestration for Karachi</em></p>

      <div class="badge">
        <span class="badge-dot"></span>
        <span class="badge-text">No Internet Connection</span>
      </div>

      <p class="message">
        Please <strong>connect to Wi-Fi or mobile data</strong> to use AISO.<br />
        Resrat the app once you're back online.
      </p>

      <div class="divider"></div>

      <div class="footer">
        <span class="tag1">#AISeekho2026 Challenge 2</span>
        <span class="tag2">Secure Orchestration Layer</span>
      </div>
    </div>
  </div>
</body>
</html>
